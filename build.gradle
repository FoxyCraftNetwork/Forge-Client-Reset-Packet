plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'net.foxmcloud.clientresetpacket'
    version = '0.4.0'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    repositories {
        mavenCentral()
    }

    tasks.register('versionedRelease', Copy) {
        group = 'build'
        from(layout.buildDirectory.file("libs/neoforge-${project.version}.jar"))
        into(rootProject.file('release'))
        rename { String filename -> "${rootProject.name}-${project.version}-neoforge-1.21.8.jar" }
    }
}
