[[mods]]
modId="clientresetpacket"
version="${version}"
displayName="Client Reset Packet"
displayURL="https://github.com/FoxyCraftNetwork/Forge-Client-Reset-Packet"
credits="Originally by Just-Chaldea and adde0109; 1.18-1.21 fork by FoxyCraftNetwork"
authors="Just-Chaldea, adde0109, FoxyCraftNetwork"
description='''
Makes proxy server switches (Velocity and similar) behave like a clean reconnect on modern Forge clients.

On Minecraft 1.20.2+ the proxy switches servers through the vanilla configuration phase. This mod resets the client-side Forge state that a real disconnect would reset (registries, network channel state, logout/level-unload events) and pauses Oculus/Iris shaders across the switch.
'''

[[dependencies.clientresetpacket]]
    modId="forge"
    mandatory=true
    versionRange="[59,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.clientresetpacket]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.9,1.22)"
    ordering="NONE"
    side="BOTH"
