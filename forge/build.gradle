buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.24,6.2)', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

minecraft {
    mappings channel: 'official', version: '1.21.4'
    copyIdeResources = true
    reobf = false // Forge 1.20.6+ runs on Mojang (official) names at runtime

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.verbose', 'true'
            args '-mixin.config=mixins.clientresetpacket.json'
            mods {
                clientresetpacket {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// FG6 dev runs on 1.20.6+: classes and resources have to share one output folder or FML cannot match
// the mods.toml to the @Mod class.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.4-54.1.22'
}

// No mixin refmap: Forge 1.20.6+ runs on Mojang's official names, so the mixin targets below are already the
// runtime names. Mixin itself is provided by Forge at runtime and on the compile classpath.

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest.attributes(
            'Specification-Title'     : 'clientresetpacket',
            'Implementation-Title'    : rootProject.name,
            'Implementation-Version'  : project.version,
            'MixinConfigs'            : 'mixins.clientresetpacket.json'
    )
}

build.finalizedBy('versionedRelease')
