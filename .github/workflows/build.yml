name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (forge 1.18.2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      # release/ also holds old committed jars; upload only the one for this build's version.
      - name: Find jar
        run: |
          VER=$(grep -oP "version = '\K[^']+" build.gradle)
          test -f "release/ForgeClientResetPacket-$VER.jar"
          echo "JAR=release/ForgeClientResetPacket-$VER.jar" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ForgeClientResetPacket-forge-1.18.2
          path: ${{ env.JAR }}
          if-no-files-found: error
