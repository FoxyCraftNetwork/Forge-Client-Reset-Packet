buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.24,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'org.spongepowered.mixin'

minecraft {
    mappings channel: 'official', version: '1.20.2'
    copyIdeResources = true
    // Forge 1.20.2-1.20.4 still runs on SRG names: the jar is reobfuscated and mixins need a refmap.

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.verbose', 'true'
            args '-mixin.config=mixins.clientresetpacket.json'
            mods {
                clientresetpacket {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft 'net.minecraftforge:forge:1.20.2-48.1.0'
}

// Forge 1.20.2-1.20.4 runs on SRG names, so mixin targets are remapped through a refmap generated by MixinGradle.
mixin {
    add sourceSets.main, 'mixins.clientresetpacket.refmap.json'
    config 'mixins.clientresetpacket.json'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest.attributes(
            'Specification-Title'     : 'clientresetpacket',
            'Implementation-Title'    : rootProject.name,
            'Implementation-Version'  : project.version,
            'MixinConfigs'            : 'mixins.clientresetpacket.json'
    )
}

jar.finalizedBy('reobfJar')
build.finalizedBy('versionedRelease')
