modLoader="javafml"
loaderVersion="[1,)"
license="DBAD"
issueTrackerURL="https://github.com/FoxyCraftNetwork/Forge-Client-Reset-Packet/issues"

[[mods]]
modId="clientresetpacket"
version="${version}"
displayName="Client Reset Packet"
displayURL="https://github.com/FoxyCraftNetwork/Forge-Client-Reset-Packet"
credits="Originally by Just-Chaldea and adde0109; 1.18+ fork by FoxyCraftNetwork"
authors="Just-Chaldea, adde0109, FoxyCraftNetwork"
# Client-only: never required on the server, never marks a server as incompatible.
displayTest="IGNORE_ALL_VERSION"
description='''
Makes proxy server switches (Velocity and similar) behave like a clean reconnect on NeoForge clients.

On Minecraft 1.20.2+ the proxy switches servers through the vanilla configuration phase. This mod resets the client-side NeoForge state that a real disconnect would reset (synced registries, negotiated network channels and packet filters, logout event) so the next backend can be NeoForge, another modded server or vanilla/Paper, and pauses Iris shaders across the switch.
'''

[[mixins]]
config="mixins.clientresetpacket.json"

[[dependencies.clientresetpacket]]
    modId="neoforge"
    type="required"
    versionRange="[21.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.clientresetpacket]]
    modId="minecraft"
    type="required"
    versionRange="[1.21,1.21.2)"
    ordering="NONE"
    side="CLIENT"
